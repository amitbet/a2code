name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

permissions:
  contents: write
  id-token: none

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_VERSION:-}" ]]; then
            raw="${DISPATCH_VERSION}"
          else
            latest_tag="$(
              git tag --list 'v*.*.*' \
                | grep -Ev -- '-nightly\.' \
                | sort -V \
                | tail -n 1
            )"

            if [[ -z "$latest_tag" ]]; then
              version="0.0.1"
            else
              current="${latest_tag#v}"
              if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest stable tag has unexpected format: $latest_tag" >&2
                exit 1
              fi

              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              version="${major}.${minor}.$((patch + 1))"
            fi

            raw="v$version"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=A2 Code v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - id: previous_tag
        name: Resolve previous release tag
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'v*.*.*' \
              | grep -Ev -- '-nightly\.' \
              | grep -Fxv "${{ steps.release_meta.outputs.tag }}" \
              | sort -V \
              | tail -n 1
          )"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  build_payload:
    name: Build payload hot-update asset
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # JS-only payload hot-update asset (server + web client). Arch-independent,
      # so it builds on a fast Linux runner and gates release creation instead of
      # the full desktop builds. The server bundle (apps/server/dist) it packages
      # is produced by build:desktop.
      - name: Build server bundle
        shell: bash
        run: vp run build:desktop

      - name: Build payload hot-update asset
        shell: bash
        env:
          T3CODE_PAYLOAD_VERSION: ${{ needs.preflight.outputs.version }}
          T3CODE_PAYLOAD_SIGNING_KEY: ${{ secrets.T3CODE_PAYLOAD_SIGNING_KEY }}
        run: |
          vp run dist:payload:asset

      - name: Collect payload assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/payload-*.tar.gz" "release/payload-manifest.json"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-payload
          path: release-publish/*
          if-no-files-found: error

  build_macos_arm64:
    name: Build macOS arm64
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          # macOS runners default to a 256 open-file soft limit. electron-builder
          # opens many files at once while (ad-hoc) signing the fully-unpacked
          # node_modules tree (asarUnpack includes **/node_modules/** for the WSL
          # backend), which overruns it with EMFILE. Raise the limit for the build.
          ulimit -n 65536
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error

  build_macos_x64:
    name: Build macOS x64
    needs: preflight
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          # See the arm64 job: raise the macOS open-file limit so electron-builder
          # doesn't hit EMFILE while signing the unpacked node_modules tree.
          ulimit -n 65536
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          for manifest in release-publish/*-mac.yml; do
            mv "$manifest" "${manifest%.yml}-x64.yml"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-x64
          path: release-publish/*
          if-no-files-found: error

  build_linux_x64:
    name: Build Linux x64
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install ImageMagick
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.AppImage" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release-publish/*
          if-no-files-found: error

  build_windows_x64:
    name: Build Windows x64
    needs: preflight
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --verbose

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: release-publish/*
          if-no-files-found: error

  build_android_preview_apk:
    name: Build Android preview APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    outputs:
      apk_exists: ${{ steps.apk_meta.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi
          # `yes` gets SIGPIPE once sdkmanager stops reading; swallow its
          # broken-pipe exit so pipefail doesn't fail an otherwise-OK step.
          ( yes 2>/dev/null || true ) | "$SDKMANAGER" --licenses >/dev/null

      - name: Build Android preview debug APK
        continue-on-error: true
        shell: bash
        run: |
          # `vp run` doesn't execute the script's `&& cd && ./gradlew` chain as
          # a shell, so run prebuild (single command, works) via vp, then drive
          # Gradle from bash where cd/./gradlew behave normally.
          vp run --filter @t3tools/mobile prebuild:android:ci
          cd apps/mobile/android
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            assembleDebug

      - id: apk_meta
        name: Detect Android APK output
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(apps/mobile/android/app/build/outputs/apk/debug/*.apk)
          if (( ${#files[@]} > 0 )); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android APK missing::Build Android preview debug APK produced no .apk (build:android:ci likely failed); the Append Android preview APK job will be skipped."
          fi

      - name: Upload Android APK
        if: ${{ steps.apk_meta.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-preview-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build_payload.result == 'success'
    name: Publish GitHub Release
    needs:
      - preflight
      - build_payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download payload artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-payload
          path: release-assets

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/payload-*.tar.gz
            release-assets/payload-manifest.json
          fail_on_unmatched_files: false

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/payload-*.tar.gz
            release-assets/payload-manifest.json
          fail_on_unmatched_files: false

  append_macos_arm64:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      needs.build_macos_arm64.result == 'success'
    name: Append macOS arm64 assets
    needs:
      - preflight
      - release
      - build_macos_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac-arm64
          path: release-assets

      - name: Upload macOS arm64 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: false

  append_macos_x64:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      needs.build_macos_x64.result == 'success'
    name: Append macOS x64 assets
    needs:
      - preflight
      - release
      - build_macos_x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac-x64
          path: release-assets

      - name: Upload macOS x64 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: false

  append_linux_x64:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      needs.build_linux_x64.result == 'success'
    name: Append Linux x64 assets
    needs:
      - preflight
      - release
      - build_linux_x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64
          path: release-assets

      - name: Upload Linux x64 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          files: |
            release-assets/*.AppImage
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: false

  append_windows_x64:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      needs.build_windows_x64.result == 'success'
    name: Append Windows x64 assets
    needs:
      - preflight
      - release
      - build_windows_x64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Upload Windows x64 assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: false

  append_android_preview_apk:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.release.result == 'success' &&
      needs.build_android_preview_apk.outputs.apk_exists == 'true'
    name: Append Android preview APK
    needs:
      - preflight
      - release
      - build_android_preview_apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: mobile-android-preview-debug-apk
          path: release-assets

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          files: |
            release-assets/*.apk
          fail_on_unmatched_files: false
