name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

permissions:
  contents: write
  id-token: none

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      ref: ${{ github.sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${DISPATCH_VERSION:-}" ]]; then
            raw="${DISPATCH_VERSION}"
          else
            latest_tag="$(
              git tag --list 'v*.*.*' \
                | grep -Ev -- '-nightly\.' \
                | sort -V \
                | tail -n 1
            )"

            if [[ -z "$latest_tag" ]]; then
              version="0.0.1"
            else
              current="${latest_tag#v}"
              if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Latest stable tag has unexpected format: $latest_tag" >&2
                exit 1
              fi

              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              version="${major}.${minor}.$((patch + 1))"
            fi

            raw="v$version"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "name=A2 Code v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - id: previous_tag
        name: Resolve previous release tag
        shell: bash
        run: |
          previous_tag="$(
            git tag --list 'v*.*.*' \
              | grep -Ev -- '-nightly\.' \
              | grep -Fxv "${{ steps.release_meta.outputs.tag }}" \
              | sort -V \
              | tail -n 1
          )"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  build_payload:
    name: Build payload hot-update asset
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # Upstream's Linux browser-import helper (apps/desktop/scripts/build-browser-secret.mjs)
      # compiles a small C binary against libsecret, and build:desktop runs it on Linux.
      - name: Install Linux browser-import build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      # JS-only payload hot-update asset (server + web client). Arch-independent,
      # so it builds on a fast Linux runner and gates release creation instead of
      # the full desktop builds. The server bundle (apps/server/dist) it packages
      # is produced by build:desktop.
      - name: Build server bundle
        shell: bash
        run: vp run build:desktop

      - name: Build payload hot-update asset
        shell: bash
        env:
          T3CODE_PAYLOAD_VERSION: ${{ needs.preflight.outputs.version }}
          T3CODE_PAYLOAD_SIGNING_KEY: ${{ secrets.T3CODE_PAYLOAD_SIGNING_KEY }}
        run: |
          vp run dist:payload:asset

      - name: Collect payload assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/payload-*.tar.gz" "release/payload-manifest.json"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload payload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-payload
          path: release-publish/*
          if-no-files-found: error

  release:
    if: |
      !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build_payload.result == 'success'
    name: Publish GitHub Release
    needs:
      - preflight
      - build_payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download payload artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-payload
          path: release-assets

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/payload-*.tar.gz
            release-assets/payload-manifest.json
          fail_on_unmatched_files: false

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/payload-*.tar.gz
            release-assets/payload-manifest.json
          fail_on_unmatched_files: false
