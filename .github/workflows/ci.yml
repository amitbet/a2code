name: Build Installers

on:
  workflow_dispatch:
    inputs:
      android_variant:
        description: "Android app variant to build (auto matches the latest release channel)."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - preview
          - production

permissions:
  contents: read

jobs:
  resolve_latest_release:
    name: Resolve latest existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      version: ${{ steps.release_meta.outputs.version }}
      android_variant: ${{ steps.release_meta.outputs.android_variant }}
    steps:
      - id: release_meta
        name: Resolve release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease)"
          tag="$(jq -r '.tagName' <<< "$release_json")"
          is_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"
          version="${tag#v}"

          if [[ -z "$tag" || "$tag" == "$version" ]]; then
            echo "The latest release has no v-prefixed tag." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Latest release tag has unexpected format: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$is_prerelease" == "true" ]]; then
            echo "android_variant=preview" >> "$GITHUB_OUTPUT"
          else
            echo "android_variant=production" >> "$GITHUB_OUTPUT"
          fi

  build_android_standalone_apk:
    name: Build Android standalone APK
    needs: resolve_latest_release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/bin/sdkmanager"
          fi
          # `yes` gets SIGPIPE once sdkmanager stops reading; swallow its
          # broken-pipe exit so pipefail doesn't fail an otherwise-OK step.
          ( yes 2>/dev/null || true ) | "$SDKMANAGER" --licenses >/dev/null

      - id: android_variant
        name: Resolve Android build variant
        shell: bash
        run: |
          variant="${{ inputs.android_variant }}"
          if [[ "$variant" == "auto" ]]; then
            variant="${{ needs.resolve_latest_release.outputs.android_variant }}"
          fi
          if [[ "$variant" != "preview" && "$variant" != "production" ]]; then
            echo "Unsupported Android variant: $variant" >&2
            exit 1
          fi
          echo "variant=$variant" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android project
        shell: bash
        run: |
          case "${{ steps.android_variant.outputs.variant }}" in
            preview)
              vp run --filter @t3tools/mobile prebuild:android:ci
              ;;
            production)
              vp run --filter @t3tools/mobile prebuild:android:prod:ci
              ;;
          esac

      - name: Build Android standalone release APK
        shell: bash
        run: |
          cd apps/mobile/android
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2 \
            -PreactNativeArchitectures=arm64-v8a \
            --build-cache \
            assembleRelease

      - name: Upload Android APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-${{ steps.android_variant.outputs.variant }}-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify target release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload Android APK to release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/mobile/android/app/build/outputs/apk/release/*.apk)
          if (( ${#files[@]} == 0 )); then
            echo "Android standalone APK was not found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build_macos_arm64:
    name: Build macOS arm64
    needs: resolve_latest_release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve_latest_release.outputs.version }}"

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          # macOS runners default to a 256 open-file soft limit; electron-builder
          # overruns it (EMFILE) while signing the fully-unpacked node_modules tree
          # (asarUnpack includes **/node_modules/** for the WSL backend). Raise it.
          ulimit -n 65536
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch arm64 \
            --build-version "${{ needs.resolve_latest_release.outputs.version }}" \
            --verbose

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.dmg" "release/*.zip" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-arm64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify target release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload macOS installer to latest release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-publish/*.dmg release-publish/*.zip release-publish/*.blockmap release-publish/*.yml)
          if (( ${#files[@]} == 0 )); then
            echo "macOS installer assets were not found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build_linux_x64:
    name: Build Linux x64
    needs: resolve_latest_release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve_latest_release.outputs.version }}"

      # Upstream's Linux browser-import helper (apps/desktop/scripts/build-browser-secret.mjs)
      # compiles a small C binary against libsecret, and build:desktop runs it on Linux.
      - name: Install Linux browser-import build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install ImageMagick
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target AppImage \
            --arch x64 \
            --build-version "${{ needs.resolve_latest_release.outputs.version }}" \
            --verbose

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.AppImage" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify target release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload Linux installer to latest release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-publish/*.AppImage release-publish/*.blockmap release-publish/*.yml)
          if (( ${#files[@]} == 0 )); then
            echo "Linux installer assets were not found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  build_windows_x64:
    name: Build Windows x64
    needs: resolve_latest_release
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve_latest_release.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build unsigned desktop artifact
        shell: bash
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.resolve_latest_release.outputs.version }}" \
            --verbose

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-x64
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

      - name: Verify target release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Upload Windows installer to latest release
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve_latest_release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-publish/*.exe release-publish/*.blockmap release-publish/*.yml)
          if (( ${#files[@]} == 0 )); then
            echo "Windows installer assets were not found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
